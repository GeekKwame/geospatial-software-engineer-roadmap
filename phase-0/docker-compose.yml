services:
  postgis:
    image: postgis/postgis:17-3.5
    container_name: roadmap-postgis
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo_dev_password
      POSTGRES_DB: gis
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d gis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: